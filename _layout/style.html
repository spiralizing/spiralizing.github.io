<!-- style adjustments -->
<style>
        :root {
            --content-width: 800px;
            --content-padding: 5%;
        }
        
        .franklin-content {
            padding-left: var(--content-padding);
            max-width: 100%;
        }
        @media (min-width: 740px) {
            .franklin-content {
                width: var(--content-width);
                margin-left: 5px;
                padding-left: 90px;
            }
            
            .header {
                width: 900px;
            }
        }
       
        /* Improve accessibility for screen readers */
        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border-width: 0;
        }

        /* Skip-to-main navigation link */
        .skip-link {
            position: absolute;
            top: -50px;
            left: 0;
            background: var(--accent-color, #E64833);
            color: #fff;
            padding: 8px 16px;
            z-index: 10000;
            transition: top 0.2s ease;
            font-weight: 600;
            text-decoration: none;
            border-radius: 0 0 4px 0;
        }
        .skip-link:focus {
            top: 0;
        }

        /* Custom focus indicators for keyboard navigation */
        a:focus-visible,
        button:focus-visible,
        [role="button"]:focus-visible {
            outline: 3px solid var(--accent-color, #E64833);
            outline-offset: 2px;
            border-radius: 2px;
        }
</style>
