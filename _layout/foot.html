  <script>
    /* Toggle aria-expanded on menu button when menu state changes.
       NOTE: use block comments only in inline scripts. optimize() minifies each
       HTML file down to a single line, so a // comment swallows the rest of the
       script on the deployed site (works locally, dead in production). */
    (function() {
      var menuLink = document.getElementById('menuLink');
      var layout = document.getElementById('layout');
      if (menuLink && layout) {
        var observer = new MutationObserver(function() {
          var isActive = layout.className.indexOf('active') !== -1;
          menuLink.setAttribute('aria-expanded', isActive ? 'true' : 'false');
        });
        observer.observe(layout, { attributes: true, attributeFilter: ['class'] });
      }
    })();
  </script>
  <script>
    /* Light / dark theme toggle (persisted in localStorage) */
    (function () {
      var btn = document.getElementById('themeToggle');
      if (!btn) return;
      var root = document.documentElement;
      var txt = btn.querySelector('.theme-toggle-txt');
      function current() {
        return root.getAttribute('data-theme') ||
          (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      }
      function apply(t) {
        root.setAttribute('data-theme', t);
        try { localStorage.setItem('theme', t); } catch (e) {}
        if (txt) txt.textContent = t;
        btn.setAttribute('aria-label', 'Switch to ' + (t === 'dark' ? 'light' : 'dark') + ' theme');
      }
      apply(current());
      btn.addEventListener('click', function () {
        apply(current() === 'dark' ? 'light' : 'dark');
      });
    })();
  </script>
